name: typingo-kokoro

services:
  typingo-kokoro:
    build:
      context: .
      dockerfile: Dockerfile
    image: typing-kokoro:latest

    container_name: typingo-kokoro

    ports:
      - "127.0.0.1:${KOKORO_SERVE_PORT:-9000}:9000"

    environment:
      KOKORO_SERVE_MODEL_REPO: ${KOKORO_SERVE_MODEL_REPO:-hexgrad/Kokoro-82M}
      KOKORO_SERVE_DEVICE: ${KOKORO_SERVE_DEVICE:-auto}
      KOKORO_SERVE_MAX_INPUT_CHARS: ${KOKORO_SERVE_MAX_INPUT_CHARS:-4096}
      KOKORO_SERVE_MAX_CONCURRENCY: ${KOKORO_SERVE_MAX_CONCURRENCY:-0}
      KOKORO_SERVE_TORCH_NUM_THREADS: ${KOKORO_SERVE_TORCH_NUM_THREADS:-0}
      KOKORO_SERVE_DYNAMIC_CONCURRENCY: ${KOKORO_SERVE_DYNAMIC_CONCURRENCY:-true}
      KOKORO_SERVE_RESOURCE_CHECK_SECONDS: ${KOKORO_SERVE_RESOURCE_CHECK_SECONDS:-5}
      KOKORO_SERVE_MP3_QUALITY: ${KOKORO_SERVE_MP3_QUALITY:-0}
      KOKORO_SERVE_RESOURCE_RESERVE_FRACTION: ${KOKORO_SERVE_RESOURCE_RESERVE_FRACTION:-0.25}
      KOKORO_SERVE_RESERVE_MEMORY_MB: ${KOKORO_SERVE_RESERVE_MEMORY_MB:-2048}
      KOKORO_SERVE_RESERVE_VRAM_MB: ${KOKORO_SERVE_RESERVE_VRAM_MB:-1536}
      HF_HOME: /data/huggingface
      HF_HUB_DISABLE_SYMLINKS: '1'

    volumes:
      - ./data/huggingface:/data/huggingface
      - ./output:/app/output

    restart: unless-stopped
